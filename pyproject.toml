[project]
name = "finvex"
version = "0.0.1"
description = "Contenido informacional de los momentos de orden superior implicitos y su integracion en una extension de Black-Litterman"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Juan David Calderon" }]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "pyarrow>=16.0",
  "duckdb>=1.0",
]

[project.optional-dependencies]
research = [
  "statsmodels>=0.14",
  "arch>=7.0",
  "cvxpy>=1.5",
  "highspy>=1.7",
  "clarabel>=0.9",
]
options = [
  "QuantLib>=1.34",
]
notebooks = [
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
]

[project.scripts]
finvex = "finvex.adapters.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finvex"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src/finvex"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "scipy.*", "statsmodels.*", "arch.*", "cvxpy.*", "QuantLib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "needs_data: requiere datos con licencia; no corre en CI",
  "slow: tarda mas de unos segundos",
  "validation: checkpoint de validacion (V1..V7)",
]
